<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Crystal Explorer">
  <defs>
    <linearGradient id="gTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DED4F8"/>
    </linearGradient>
    <linearGradient id="gPurpleUp" x1="0" y1="0" x2="1" y2="1">
