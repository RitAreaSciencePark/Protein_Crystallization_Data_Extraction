software:
  # ─────────────────────────────────────────────────────────
  # BASIC METADATA
  # ─────────────────────────────────────────────────────────
  id: "https://github.com/RitAreaSciencePark/Protein_Crystallization_Data_Extraction"
  name: "Protein Crystallization Data Extraction"
  shortname: "PCDE"
  type: "command-line tool + web application"
  
  # ─────────────────────────────────────────────────────────
  # DESCRIPTION
  # ─────────────────────────────────────────────────────────
  description:
    short: "Automated tool for retrieving and analyzing protein crystallization conditions from RCSB PDB"
    long: |
      PCDE is a computational pipeline that transforms protein sequences into 
      analysis-ready datasets of crystallization conditions. It combines sequence 
      similarity searching (MMseqs2), parallel metadata extraction, intelligent 
      free-text parsing, and publication-quality visualization.
      
      The tool accepts any protein, DNA, or RNA sequence as input and produces:
      - Merged CSV datasets with 20+ experimental parameters
      - High-resolution scatter plots (pH vs Temperature, pH vs PEG concentration)
      - Colored PDF crystallization cocktail tables
      - FAIR-compliant metadata with full provenance tracking
  
  keywords:
    - protein crystallography
    - crystallization conditions
    - PDB (Protein Data Bank)
    - data mining
    - structural biology
    - automated pipeline
    - sequence similarity search
    - metadata extraction
    - FAIR principles
  
  # ─────────────────────────────────────────────────────────
  # VERSION & RELEASE INFORMATION
  # ─────────────────────────────────────────────────────────
  version:
    current: "1.0.1"
    latest: "1.0.1"
