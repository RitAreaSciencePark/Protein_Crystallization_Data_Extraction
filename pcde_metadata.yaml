  # ─────────────────────────────────────────────────────────
  # DEPENDENCIES
  # ─────────────────────────────────────────────────────────
  dependencies:
    required:
      - name: "django"
        version: "6.0.5"
        url: "https://www.djangoproject.com/"
        license: "BSD"
        purpose: "Web application framework"
        
      - name: "requests"
        version: "2.34.2"
        url: "https://requests.readthedocs.io/"
        license: "Apache 2.0"
        purpose: "HTTP client for RCSB API calls"
        
      - name: "pandas"
        version: "3.0.3"
        url: "https://pandas.pydata.org/"
        license: "BSD 3-Clause"
        purpose: "Data manipulation and CSV handling"
        
      - name: "gemmi"
        version: "0.7.5"
        url: "https://gemmi.readthedocs.io/"
        license: "MPL 2.0"
        purpose: "mmCIF file parsing"
        
      - name: "matplotlib"
        version: "3.10.9"
        url: "https://matplotlib.org/"
        license: "PSF"
        purpose: "Scatter plots and PDF table generation"
        
      - name: "numpy"
        version: "2.4.6"
        url: "https://numpy.org/"
        license: "BSD"
        purpose: "Numerical operations"
        
      - name: "tqdm"
        version: "4.67.3"
        url: "https://tqdm.github.io/"
        license: "MPL 2.0"
        purpose: "Progress bar for CLI"
    
    external_services:
      - name: "RCSB Protein Data Bank"
        url: "https://www.rcsb.org/"
        api: "https://search.rcsb.org/rcsbsearch/v2/query"
        status: "Required"
        description: "Primary data source for protein structures"
  
  # ─────────────────────────────────────────────────────────
  # MODULES (COMPONENTS)
  # ─────────────────────────────────────────────────────────
  modules:
    - id: "pcde:module:rcsb-sequence-identity"
      name: "RCSB Sequence Identity Module"
      file: "src/rcsb_sequence_identity.py"
      version: "1.0.0"
      description: "Search RCSB PDB by protein sequence using MMseqs2"
      functions:
        - id: "pcde:fn:search-pdb-by-sequence"
          name: "search_pdb_by_sequence"
          signature: "search_pdb_by_sequence(sequence: str, max_hits: int = 1000) -> List[Dict]"
          uri: "/api/v1/search/sequence"
          
        - id: "pcde:fn:detect-sequence-type"
          name: "detect_seq_type"
          signature: "detect_seq_type(sequence: str) -> Literal['protein', 'dna', 'rna']"
          uri: "/api/v1/analyze/sequence-type"
    
    - id: "pcde:module:pdb-search-api"
      name: "PDB Search & Crystallization Extraction Module"
      file: "src/PDB_searchAPI.py"
      version: "1.0.0"
      description: "Retrieve and filter crystallization metadata from RCSB PDB"
      functions:
        - id: "pcde:fn:search-pdb-by-sequence-api"
          name: "search_pdb_by_sequence"
          uri: "/api/v1/extract/crystallization"
          
        - id: "pcde:fn:filter-experimental-conditions"
          name: "filter_experimental_conditions"
          uri: "/api/v1/filter/experimental-conditions"
    
    - id: "pcde:module:extract-structures"
      name: "Compound Annotation Module"
      file: "src/extract_structures.py"
      version: "1.0.0"
      description: "Annotate crystallization data with compound information"
      functions:
        - id: "pcde:fn:append-compound"
          name: "append_compound_to_filtered_csv"
          uri: "/api/v1/annotate/compounds"
    
    - id: "pcde:module:plot"
      name: "Visualization Module"
      file: "src/plot.py"
      version: "1.0.0"
      description: "Generate scatter plots and PDF reports"
      functions:
        - id: "pcde:fn:run-plot"
          name: "run_plot"
          uri: "/api/v1/visualize/plots"
    
    - id: "pcde:module:metadata-generator"
      name: "FAIR Metadata Generation Module"
      file: "src/metadata_generator.py"
      version: "1.0.0"
      description: "Generate FAIR-compliant metadata for outputs"
      functions:
        - id: "pcde:fn:generate-metadata"
          name: "generate_metadata_for_outputs"
          uri: "/api/v1/generate/metadata"
  
  # ─────────────────────────────────────────────────────────
  # DATA SOURCES
  # ─────────────────────────────────────────────────────────
  data_sources:
    - name: "RCSB Protein Data Bank (PDB)"
      url: "https://www.rcsb.org/"
      description: "Primary database of protein structures"
      api_endpoints:
        search: "https://search.rcsb.org/rcsbsearch/v2/query"
        data: "https://data.rcsb.org/rest/v1/core/entry"
      format: "mmCIF (macromolecular crystallographic information file)"
      reference: "https://doi.org/10.1038/s41592-019-0677-2"
      
    - name: "PubMed"
      url: "https://pubmed.ncbi.nlm.nih.gov/"
      description: "Publication metadata and references"
      
    - name: "MMseqs2"
      url: "https://github.com/soedinglab/MMseqs2"
      description: "Sequence similarity search engine"
      reference: "https://doi.org/10.1038/nbt.4053"
  
  # ─────────────────────────────────────────────────────────
  # OUTPUT FILES
  # ─────────────────────────────────────────────────────────
  outputs:
    - name: "{name}_sequence.fasta"
      format: "FASTA"
      description: "Input sequence saved in standard format"
      
    - name: "{name}_rcsb_hits.csv"
      format: "CSV"
      description: "MMseqs2 search results: PDB ID, entity, score, identity (%), E-value"
      columns:
        - PDB_ID
        - Entity
        - Score
        - Seq_id
        - E-value
      
    - name: "{name}_merged_results.csv"
      format: "CSV"
      description: "Full merged dataset: crystallization conditions + sequence similarity scores"
      columns:
        - PDB_ID
        - Entity
        - Score
        - Seq_id
        - E-value
        - Resolution
        - Pubmed_id
        - Method
        - pH
        - Temp
        - Ligands
        - Polymer
        - Assembly
        - pdbx_pH_range
        - pdbx_details
        - Compounds
        - PEG_Id
        - PEG_con
      
    - name: "{name}_TEMP.png"
      format: "PNG"
      resolution: "300 dpi"
      description: "Scatter plot: pH vs Temperature (K), coloured by similarity score"
      
    - name: "{name}_PEG.png"
      format: "PNG"
      resolution: "300 dpi"
      description: "Scatter plot: pH vs PEG concentration (%), coloured by similarity score"
      
    - name: "{name}_Cryst_cocktail_Table.pdf"
      format: "PDF"
      description: "Coloured summary table of all unique crystallization conditions"
      
    - name: "{name}_metadata.json"
      format: "JSON-LD"
      description: "FAIR-compliant metadata for all output files"
  
